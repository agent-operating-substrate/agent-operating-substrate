id: go-error-wrap-001
version: 1
status: active
scope:
  paths:
  - '**/*.go'
  languages:
  - go
invariant:
  statement: Go functions returning an error must have that error checked; discarding
    errors via blank identifier '_' is prohibited, and returned errors must be wrapped
    with contextual information using fmt.Errorf with %w.
  rationale: Preserves error context across package boundaries and enables errors.Is
    and errors.As inspection in caller packages.
  enforcement: reject_diff
  max_blast_radius_lines: 30
provenance:
  incident_id: pack-go-core
  git_commit: HEAD
  inscribing_agent: pack-installer
  created_at: '2026-09-13T07:18:26Z'
  last_verified_at: '2026-09-13T07:18:26Z'
  trigger_count: 1
  peer_consensus_agent: pack-curator
