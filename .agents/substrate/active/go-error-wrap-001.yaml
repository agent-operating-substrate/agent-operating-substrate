id: go-error-wrap-001
version: 1
status: active
scope:
  paths:
  - '**/*.go'
  languages:
  - go
invariant:
  statement: Go functions must inspect non-nil error values and return wrapped errors
    with fmt.Errorf and %w.
  rationale: Preserves call context and enables errors.Is and errors.As inspection
    across package boundaries.
  enforcement: reject_diff
  max_blast_radius_lines: 30
