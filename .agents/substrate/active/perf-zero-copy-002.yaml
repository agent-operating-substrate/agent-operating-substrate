id: perf-zero-copy-002
version: 1
status: active
scope:
  paths:
  - src/**/streaming/**
  - src/**/simd/**
  languages:
  - cpp
  - python
  - rust
invariant:
  statement: High-throughput streaming loops and packet parsers must operate on memory
    views or slices without heap reallocations.
  rationale: Intermediate buffer allocations degrade cache locality and introduce
    latency spikes in hot execution paths.
  enforcement: warn
  max_blast_radius_lines: 30
