id: ts-no-any-001
version: 1
status: active
scope:
  paths:
  - src/**/*.ts
  - src/**/*.tsx
  languages:
  - typescript
invariant:
  statement: TypeScript variables, parameters, and return types must avoid explicit
    any and use unknown or generic constraints.
  rationale: Any types disable compiler type checking and allow runtime type errors
    to propagate silently.
  enforcement: reject_diff
  max_blast_radius_lines: 30
