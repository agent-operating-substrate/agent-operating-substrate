id: ts-no-any-001
version: 1
status: active
scope:
  paths:
  - '**/*.ts'
  - '**/*.tsx'
  languages:
  - typescript
invariant:
  statement: TypeScript variables, parameters, and return types must avoid explicit
    'any'; use 'unknown', union types, generic constraints, or explicit interfaces
    instead.
  rationale: The 'any' type disables compiler type checking, concealing potential
    runtime type errors and eliminating editor refactoring safety.
  enforcement: reject_diff
  max_blast_radius_lines: 30
provenance:
  incident_id: pack-typescript-core
  git_commit: HEAD
  inscribing_agent: pack-installer
  created_at: '2026-09-13T07:18:25Z'
  last_verified_at: '2026-09-13T07:18:25Z'
  trigger_count: 1
  peer_consensus_agent: pack-curator
