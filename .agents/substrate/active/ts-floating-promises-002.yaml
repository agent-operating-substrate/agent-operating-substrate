id: ts-floating-promises-002
version: 1
status: active
scope:
  paths:
  - '**/*.ts'
  - '**/*.tsx'
  languages:
  - typescript
invariant:
  statement: Asynchronous promises must be awaited, returned to the caller, or explicitly
    handled with a .catch() callback or void operator.
  rationale: Floating unhandled promises produce unhandled promise rejections, race
    conditions, and silently dropped async failures.
  enforcement: reject_diff
