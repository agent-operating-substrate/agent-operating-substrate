id: ts-floating-promises-002
version: 1
status: active
scope:
  paths:
  - src/**/*.ts
  - src/**/*.tsx
  languages:
  - typescript
invariant:
  statement: Async promises must be awaited, returned, or explicitly handled with
    a catch clause.
  rationale: Floating unhandled promises cause silent async failures and unhandled
    promise rejections.
  enforcement: reject_diff
  max_blast_radius_lines: 30
