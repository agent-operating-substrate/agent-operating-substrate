id: ts-clean-imports-004
version: 1
status: active
scope:
  paths:
  - '**/*.ts'
  - '**/*.tsx'
  languages:
  - typescript
invariant:
  statement: TypeScript modules must use explicit relative or mapped aliases, avoiding
    circular imports and deep imports into private internal module subpaths.
  rationale: Circular and poorly bounded imports cause undefined runtime values, increase
    bundled bundle size, and degrade tree shaking.
  enforcement: warn
