id: py-no-bare-except-002
version: 1
status: active
scope:
  paths:
  - '**/*.py'
  languages:
  - python
invariant:
  statement: Catching Exception or bare except blocks must not silently suppress errors
    with pass; catch specific exception classes and log or re-raise errors.
  rationale: Silent exception swallowing hides fatal runtime errors, interrupts, and
    bugs, making forensic debugging and root-cause analysis impossible.
  enforcement: reject_diff
