id: rust-no-unwrap-in-lib-002
version: 1
status: active
scope:
  paths:
  - src/**/*.rs
  - lib/**/*.rs
  languages:
  - rust
invariant:
  statement: Production Rust library and service code must not invoke .unwrap() or
    .expect() on Option or Result; propagate errors using '?' or handle them explicitly.
  rationale: Calling unwrap or expect panics the executing thread on unexpected conditions,
    crashing services without opportunity for graceful recovery.
  enforcement: reject_diff
provenance:
  incident_id: pack-rust-core
  git_commit: HEAD
  inscribing_agent: pack-installer
