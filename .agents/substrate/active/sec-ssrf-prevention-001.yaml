id: sec-ssrf-prevention-001
version: 1
status: active
scope:
  paths:
  - '**/*'
  languages:
  - go
  - java
  - javascript
  - python
  - rust
  - typescript
invariant:
  statement: Outbound HTTP and network requests constructed from dynamic user input
    must validate hostnames against an allowlist and block private or link-local IP
    addresses.
  rationale: Unvalidated outbound network requests permit SSRF attacks targeting cloud
    instance metadata services and internal microservices.
  enforcement: reject_diff
provenance:
  incident_id: pack-security-core
