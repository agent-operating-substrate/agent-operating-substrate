id: py-structured-logging-001
version: 1
status: active
scope:
  paths:
  - src/**/*.py
  - lib/**/*.py
  - app/**/*.py
  languages:
  - python
invariant:
  statement: Application, service, and core library code must use structured logging
    frameworks rather than standard print statements.
  rationale: Raw print statements lack log level metadata, bypass centralized observability
    aggregation, and pollute stdout streams.
  enforcement: warn
