id: py-no-wildcard-import-002
version: 1
status: active
scope:
  paths:
  - src/**
  - tests/**
  languages:
  - python
invariant:
  statement: Wildcard imports ('from module import *') are strictly prohibited.
  rationale: Wildcard imports cause namespace pollution, mask circular dependencies,
    and degrade linter performance.
  enforcement: reject_diff
  max_blast_radius_lines: 30
