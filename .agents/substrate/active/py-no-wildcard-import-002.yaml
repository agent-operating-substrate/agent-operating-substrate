id: py-no-wildcard-import-002
version: 1
status: active
scope:
  paths:
  - '**/*.py'
  languages:
  - python
invariant:
  statement: Wildcard imports ('from module import *') are prohibited; all imported
    symbols must be explicitly named or imported via the module namespace.
  rationale: Wildcard imports pollute module namespaces, mask circular dependencies,
    hide symbol origins, and break static analysis.
  enforcement: reject_diff
provenance:
  incident_id: pack-python-core
  git_commit: HEAD
  inscribing_agent: pack-installer
