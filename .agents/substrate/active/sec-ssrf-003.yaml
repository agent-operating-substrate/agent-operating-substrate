id: sec-ssrf-003
version: 1
status: active
scope:
  paths:
  - '**/*'
  languages:
  - go
  - javascript
  - python
  - typescript
invariant:
  statement: Outbound HTTP requests constructed from dynamic input must validate targets
    against an allowlist and block private network ranges.
  rationale: Unvalidated network requests allow SSRF attacks targeting cloud metadata
    services and internal infrastructure.
  enforcement: reject_diff
  max_blast_radius_lines: 30
