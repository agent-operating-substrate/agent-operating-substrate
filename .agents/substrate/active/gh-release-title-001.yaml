id: gh-release-title-001
version: 1
status: active
scope:
  paths:
  - .github/workflows/*release*.yml
  - .github/workflows/*publish*.yml
  languages:
  - yaml
invariant:
  statement: GitHub release titles must strictly contain only the version tag (e.g.,
    ${{ github.ref_name }} or v0.2.0) without descriptive phrases or subtitles.
  rationale: Enforces clean, predictable release naming conventions across CI pipelines
    and release automation.
  enforcement: reject_diff
