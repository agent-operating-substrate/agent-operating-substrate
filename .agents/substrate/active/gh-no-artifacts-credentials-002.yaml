id: gh-no-artifacts-credentials-002
version: 1
status: active
scope:
  paths:
  - '**/*'
  languages: []
invariant:
  statement: Build artifacts, compiled binaries, bytecode (.pyc, .class), local environment
    configuration files (.env), and IDE directories must not be committed to version
    control.
  rationale: Committing build outputs and local environment files bloats repository
    history, triggers merge conflicts, and leaks local configuration secrets.
  enforcement: reject_diff
  max_blast_radius_lines: 30
provenance:
  incident_id: pack-general-hygiene
  git_commit: HEAD
  inscribing_agent: pack-installer
  created_at: '2026-09-13T07:18:25Z'
  last_verified_at: '2026-09-13T07:18:25Z'
  trigger_count: 1
  peer_consensus_agent: pack-curator
