id: gh-deps-sync-001
version: 1
status: active
scope:
  paths:
  - package.json
  - pyproject.toml
  - Cargo.toml
  - go.mod
  - requirements*.txt
  languages:
  - json
invariant:
  statement: Changes to package dependency manifests (package.json, pyproject.toml,
    Cargo.toml, go.mod) must include synchronized updates to corresponding lockfiles.
  rationale: Desynchronized dependency manifests and lockfiles cause irreproducible
    builds, CI failures, and unexpected environment drift.
  enforcement: reject_diff
  max_blast_radius_lines: 30
provenance:
  incident_id: pack-general-hygiene
  git_commit: HEAD
  inscribing_agent: pack-installer
  created_at: '2026-09-13T07:18:25Z'
  last_verified_at: '2026-09-13T07:18:25Z'
  trigger_count: 1
  peer_consensus_agent: pack-curator
