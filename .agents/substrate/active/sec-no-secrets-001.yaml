id: sec-no-secrets-001
version: 1
status: active
scope:
  paths:
  - '**/*'
  languages: []
invariant:
  statement: API keys, private certificates, authentication tokens, and secrets must
    never be committed to source files or repository configuration.
  rationale: Hardcoded credentials in Git histories result in credential compromise,
    security audit failure, and unauthorized system access.
  enforcement: reject_diff
provenance:
  incident_id: pack-security-core
  git_commit: HEAD
  inscribing_agent: pack-installer
