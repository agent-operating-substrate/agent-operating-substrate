id: go-context-propagation-002
version: 1
status: active
scope:
  paths:
  - '**/*.go'
  languages:
  - go
invariant:
  statement: Go functions performing I/O operations, network requests, database transactions,
    or concurrent tasks must accept context.Context as their first parameter and honor
    cancellation.
  rationale: Missing context propagation leads to orphaned goroutines, resource leaks,
    and unresponsive cancellation signals during server shutdowns or request timeouts.
  enforcement: reject_diff
