id: sec-secret-leak-002
version: 1
status: active
scope:
  paths:
  - '**/*'
  languages: []
invariant:
  statement: API keys, secrets, private certificates, and passwords must never be
    committed to source files.
  rationale: Hardcoded credentials in Git histories result in credential compromise
    and audit failure.
  enforcement: reject_diff
  max_blast_radius_lines: 30
provenance:
  incident_id: pack-universal-security
  git_commit: HEAD
  inscribing_agent: pack-installer
  created_at: '2026-09-13T06:58:05Z'
  last_verified_at: '2026-09-13T06:58:05Z'
  trigger_count: 1
  peer_consensus_agent: pack-curator
