id: py-async-no-blocking-io-003
version: 1
status: active
scope:
  paths:
  - '**/*.py'
  languages:
  - python
invariant:
  statement: Asynchronous functions (async def) must not invoke synchronous blocking
    I/O calls such as time.sleep, synchronous requests, or blocking filesystem operations.
  rationale: Blocking operations in coroutines stall the main asyncio event loop,
    starving concurrent tasks and destroying service throughput.
  enforcement: reject_diff
  max_blast_radius_lines: 30
provenance:
  incident_id: pack-python-core
