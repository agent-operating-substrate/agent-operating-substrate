id: react-hooks-deps-001
version: 1
status: active
scope:
  paths:
  - src/**/*.jsx
  - src/**/*.tsx
  - app/**/*.tsx
  languages:
  - javascript
  - typescript
invariant:
  statement: React hooks (useEffect, useMemo, useCallback) must declare exhaustive
    dependencies and must not mutate component state during rendering.
  rationale: Omitted dependencies cause stale closures and out-of-sync UI state, while
    state mutations in render cause infinite re-render loops.
  enforcement: reject_diff
