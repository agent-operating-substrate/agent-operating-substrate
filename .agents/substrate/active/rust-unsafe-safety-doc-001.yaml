id: rust-unsafe-safety-doc-001
version: 1
status: active
scope:
  paths:
  - '**/*.rs'
  languages:
  - rust
invariant:
  statement: Every unsafe block, unsafe function, or unsafe trait implementation in
    Rust must include a preceding '// SAFETY:' comment documenting invariant validity.
  rationale: Audit requirement ensuring memory safety invariants and preconditions
    are explicitly documented at each unsafe boundary to verify soundness.
  enforcement: reject_diff
