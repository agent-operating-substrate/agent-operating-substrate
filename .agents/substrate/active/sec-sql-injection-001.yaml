id: sec-sql-injection-001
version: 1
status: active
scope:
  paths:
  - '**/*'
  languages:
  - csharp
  - go
  - java
  - javascript
  - php
  - python
  - ruby
  - rust
  - typescript
invariant:
  statement: SQL queries must use parameterized bind variables; raw string concatenation,
    format strings, or template interpolation is prohibited.
  rationale: Direct string interpolation in SQL strings creates critical SQL injection
    vulnerabilities allowing unauthorized data extraction or destruction.
  enforcement: reject_diff
