id: sec-sql-injection-001
version: 1
status: active
scope:
  paths:
  - '**/*'
  languages:
  - go
  - java
  - javascript
  - python
  - typescript
invariant:
  statement: SQL queries must use parameterized bind variables, never raw string interpolation
    or concatenation.
  rationale: Direct string interpolation in SQL strings creates critical SQL injection
    vulnerabilities.
  enforcement: reject_diff
  max_blast_radius_lines: 30
