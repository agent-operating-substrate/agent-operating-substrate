id: sec-safe-deserialization-001
version: 1
status: active
scope:
  paths:
  - '**/*'
  languages:
  - javascript
  - python
  - typescript
invariant:
  statement: Untrusted dynamic input must not be processed with insecure deserialization
    primitives (pickle.loads, marshal, unsafe yaml.load) or arbitrary dynamic code
    evaluation (eval, exec).
  rationale: Insecure deserialization and arbitrary eval calls allow attackers to
    execute arbitrary code via gadget chains and dynamic interpretation.
  enforcement: reject_diff
  max_blast_radius_lines: 30
provenance:
  incident_id: pack-security-core
  git_commit: HEAD
  inscribing_agent: pack-installer
  created_at: '2026-09-13T07:18:25Z'
  last_verified_at: '2026-09-13T07:18:25Z'
  trigger_count: 1
  peer_consensus_agent: pack-curator
