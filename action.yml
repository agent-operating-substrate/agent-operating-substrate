name: 'AOS Guardrails Gatekeeper'
description: 'Deterministic behavior firewall and invariant enforcement for AI-generated code on Pull Requests'
author: 'AOS Core Team'

inputs:
  github_token:
    description: 'GitHub token for posting sticky PR comments'
    required: false
    default: '${{ github.token }}'
  base_ref:
    description: 'Base git reference to evaluate diff against'
    required: false
    default: '${{ github.base_ref }}'
  fail_on_violation:
    description: 'Whether to fail the CI check when violations are detected'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install AOS
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run AOS Gatekeeper
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        BASE_REF="${{ inputs.base_ref }}"
        if [ -z "$BASE_REF" ]; then
          BASE_REF="origin/main"
        fi
        if [ "${{ inputs.fail_on_violation }}" = "false" ]; then
          python -m aos ci run --auto-sync --comment --base "$BASE_REF" || true
        else
          python -m aos ci run --auto-sync --comment --base "$BASE_REF"
        fi
