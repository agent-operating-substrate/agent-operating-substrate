<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="aosBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#070A10" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="aosFirewallAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="aosStigmergicCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="aosGuardrailEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="aosFacetTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="aosFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="aosFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75"/>
    </linearGradient>

    <filter id="aosAmberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="aosCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="32" fill="url(#aosBgGlow)"/>

  <g stroke="#1E293B" stroke-width="1" stroke-opacity="0.4">
    <line x1="256" y1="24" x2="256" y2="488"/>
    <line x1="36" y1="248" x2="476" y2="248"/>
    <circle cx="256" cy="248" r="180" fill="none" stroke-dasharray="4 8"/>
  </g>

  <!-- PILLAR 1: DETERMINISTIC BEHAVIOR FIREWALL (SHIELD PERIMETER) -->
  <path d="M 256 36 L 444 144 L 444 320 L 256 476 L 68 320 L 68 144 Z"
        fill="#0B0F19" fill-opacity="0.88"
        stroke="url(#aosFirewallAmber)" stroke-width="5" stroke-linejoin="round"
        filter="url(#aosAmberGlow)"/>

  <path d="M 256 58 L 424 155 L 424 312 L 256 452 L 88 312 L 88 155 Z"
        fill="none"
        stroke="#EA580C" stroke-width="1.5" stroke-dasharray="8 5" stroke-opacity="0.7"/>

  <g stroke="#F59E0B" stroke-width="2.5" fill="none">
    <path d="M 240 24 L 256 14 L 272 24"/>
    <path d="M 244 488 L 256 498 L 268 488"/>
    <line x1="56" y1="248" x2="68" y2="248"/>
    <line x1="444" y1="248" x2="456" y2="248"/>
  </g>

  <!-- PILLAR 3: DECENTRALIZED STIGMERGY (HEXAGONAL COORDINATE MESH) -->
  <g stroke="url(#aosStigmergicCyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#aosCyanGlow)">
    <polygon points="256,118 369,183 369,313 256,378 143,313 143,183"
             fill="none" stroke="url(#aosStigmergicCyan)" stroke-width="2"/>

    <line x1="256" y1="58" x2="256" y2="118"/>
    <line x1="424" y1="155" x2="369" y2="183"/>
    <line x1="424" y1="312" x2="369" y2="313"/>
    <line x1="256" y1="452" x2="256" y2="378"/>
    <line x1="88" y1="312" x2="143" y2="313"/>
    <line x1="88" y1="155" x2="143" y2="183"/>

    <line x1="256" y1="118" x2="310" y2="217" stroke="#0EA5E9" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="369" y1="183" x2="310" y2="279" stroke="#0EA5E9" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="369" y1="313" x2="256" y2="310" stroke="#0EA5E9" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="256" y1="378" x2="202" y2="279" stroke="#0EA5E9" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="143" y1="313" x2="202" y2="217" stroke="#0EA5E9" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="143" y1="183" x2="256" y2="186" stroke="#0EA5E9" stroke-width="1.2" stroke-opacity="0.6"/>

    <line x1="256" y1="118" x2="256" y2="186" stroke="url(#aosStigmergicCyan)" stroke-width="2"/>
    <line x1="369" y1="183" x2="310" y2="217" stroke="url(#aosStigmergicCyan)" stroke-width="2"/>
    <line x1="369" y1="313" x2="310" y2="279" stroke="url(#aosStigmergicCyan)" stroke-width="2"/>
    <line x1="256" y1="378" x2="256" y2="310" stroke="url(#aosStigmergicCyan)" stroke-width="2"/>
    <line x1="143" y1="313" x2="202" y2="279" stroke="url(#aosStigmergicCyan)" stroke-width="2"/>
    <line x1="143" y1="183" x2="202" y2="217" stroke="url(#aosStigmergicCyan)" stroke-width="2"/>
  </g>

  <!-- PILLAR 2: PERMANENT MEMORY INSCRIPTION (CRYSTALLINE MONOLITH) -->
  <path d="M 256 248 L 202 217 L 256 186 L 310 217 Z"
        fill="url(#aosFacetTop)" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 256 248 L 202 217 L 202 279 L 256 310 Z"
        fill="url(#aosFacetLeft)" stroke="#06B6D4" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 256 248 L 256 310 L 310 279 L 310 217 Z"
        fill="url(#aosFacetRight)" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>

  <g fill="#22D3EE" stroke="#083344" stroke-width="2">
    <circle cx="256" cy="118" r="5.5"/>
    <circle cx="369" cy="183" r="5.5"/>
    <circle cx="369" cy="313" r="5.5"/>
    <circle cx="256" cy="378" r="5.5"/>
    <circle cx="143" cy="313" r="5.5"/>
    <circle cx="143" cy="183" r="5.5"/>
  </g>

  <g fill="#67E8F9" stroke="#0F172A" stroke-width="1.5">
    <circle cx="256" cy="186" r="4"/>
    <circle cx="310" cy="217" r="4"/>
    <circle cx="310" cy="279" r="4"/>
    <circle cx="256" cy="310" r="4"/>
    <circle cx="202" cy="279" r="4"/>
    <circle cx="202" cy="217" r="4"/>
  </g>

  <g fill="#F59E0B" stroke="#451A03" stroke-width="1.5">
    <circle cx="256" cy="58" r="3.5"/>
    <circle cx="424" cy="155" r="3.5"/>
    <circle cx="424" cy="312" r="3.5"/>
    <circle cx="256" cy="452" r="3.5"/>
    <circle cx="88" cy="312" r="3.5"/>
    <circle cx="88" cy="155" r="3.5"/>
  </g>

  <g>
    <path d="M 256 230 L 272 248 L 256 266 L 240 248 Z"
          fill="url(#aosGuardrailEmerald)" fill-opacity="0.95"
          stroke="#A7F3D0" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="256" cy="248" r="3" fill="#FFFFFF"/>
  </g>
</svg>
