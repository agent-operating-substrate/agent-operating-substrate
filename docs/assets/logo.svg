<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="aosGradCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="aosGradEmeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="aosBgSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="aosShieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="aosShieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="aosAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <filter id="aosGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="128" cy="128" r="120" fill="url(#aosAmbientGlow)"/>

  <!-- Base Hexagonal Substrate Plate -->
  <polygon points="128,14 227,71 227,185 128,242 29,185 29,71" fill="url(#aosBgSlate)" stroke="url(#aosGradCyanEmerald)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Inner Circuit and Stigmergic Grid Lines -->
  <polygon points="128,38 206,83 206,173 128,218 50,173 50,83" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Radial Coordinate Bus Connectors -->
  <line x1="128" y1="14" x2="128" y2="64" stroke="url(#aosGradCyanEmerald)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="192" x2="128" y2="242" stroke="url(#aosGradCyanEmerald)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="29" y1="71" x2="73" y2="96" stroke="url(#aosGradCyanEmerald)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="227" y1="71" x2="183" y2="96" stroke="url(#aosGradCyanEmerald)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="29" y1="185" x2="73" y2="160" stroke="url(#aosGradCyanEmerald)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="227" y1="185" x2="183" y2="160" stroke="url(#aosGradCyanEmerald)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Layered Crystalline Frame -->
  <polygon points="128,64 183,96 183,160 128,192 73,160 73,96" fill="#0b0f19" fill-opacity="0.8" stroke="url(#aosGradEmeraldCyan)" stroke-width="3" stroke-linejoin="round" filter="url(#aosGlow)"/>

  <!-- Coordinate Stigmergy Nodes -->
  <circle cx="128" cy="38" r="5" fill="#06b6d4" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="206" cy="83" r="5" fill="#10b981" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="206" cy="173" r="5" fill="#06b6d4" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="128" cy="218" r="5" fill="#10b981" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="50" cy="173" r="5" fill="#06b6d4" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="50" cy="83" r="5" fill="#10b981" stroke="#f8fafc" stroke-width="1.5"/>

  <!-- Central Behavior Firewall Shield -->
  <g>
    <!-- Left Facet -->
    <path d="M 128,88 L 98,100 L 98,136 L 128,168 Z" fill="url(#aosShieldLeft)"/>
    <!-- Right Facet -->
    <path d="M 128,88 L 158,100 L 158,136 L 128,168 Z" fill="url(#aosShieldRight)"/>
    <!-- Shield Rim and Crest Highlight -->
    <path d="M 128,88 L 158,100 L 158,136 L 128,168 L 98,136 L 98,100 Z" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Inscribed Memory Coordinate Core -->
  <polygon points="128,116 138,128 128,140 118,128" fill="#f8fafc" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="2.5" fill="#0f172a"/>
  <line x1="112" y1="128" x2="144" y2="128" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="128" y1="112" x2="128" y2="144" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.7"/>
</svg>
